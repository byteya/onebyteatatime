<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100" role="img" aria-label="Byteya Computer Services logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b2a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1b3a5c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00c6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0072ff;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background pill -->
  <rect width="320" height="100" rx="14" ry="14" fill="url(#bgGrad)" />

  <!-- Network node icon: central node + four surrounding nodes connected by lines -->
  <!-- Lines (behind nodes) -->
  <line x1="50" y1="50" x2="28" y2="28" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="72" y2="28" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="22" y2="60" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="78" y2="70" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round"/>
  <!-- Satellite nodes -->
  <circle cx="28" cy="28" r="5" fill="#00c6ff" opacity="0.85"/>
  <circle cx="72" cy="28" r="5" fill="#00c6ff" opacity="0.85"/>
  <circle cx="22" cy="60" r="5" fill="#0072ff" opacity="0.85"/>
  <circle cx="78" cy="70" r="5" fill="#0072ff" opacity="0.85"/>
  <!-- Central hub -->
  <circle cx="50" cy="50" r="10" fill="url(#accentGrad)" />
  <!-- Binary "1 0" hint inside hub -->
  <text x="50" y="54" font-family="Courier New, monospace" font-size="8" font-weight="bold"
        fill="#0d1b2a" text-anchor="middle">01</text>

  <!-- Company name -->
  <text x="102" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700"
        fill="#ffffff" letter-spacing="1">BYTEYA</text>
  <!-- Accent underline -->
  <rect x="102" y="46" width="118" height="2.5" rx="1.25" fill="url(#accentGrad)" />
  <!-- Tagline -->
  <text x="102" y="63" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="400"
        fill="#90caf9" letter-spacing="0.5">Computer Services LLC</text>
  <!-- Sub-tagline -->
  <text x="102" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="9" font-weight="300"
        fill="#64b5f6" letter-spacing="1.5">NETWORK CONSULTING</text>
</svg>
